name: MacOS Qt6
on:
  push:
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "BUILD.md"
  pull_request:
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "BUILD.md"
  release:
    types: [published]
jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        build_type: [Release, RelWithDebInfo, Debug]
        arch: [x86_64, arm64]
        qt_ver: [6.12.0]
        qt_arch: [clang_64]
    env:
      targetName: lemon
    steps:
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_ver }}
          cache: true

      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Prepare artifact name
        id: artifact_name
        uses: ./.github/actions/artifact-name
        with:
          platform: macos
          arch: ${{ matrix.arch }}
          build-type: ${{ matrix.build_type }}
      - name: build macos
        run: |
          cmake . \
            -GNinja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DLEMON_BUILD_INFO="Build for macOS" \
            -DLEMON_BUILD_EXTRA_INFO="Build on $(uname -sr)" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}" 
          cmake --build . --parallel $(sysctl -n hw.logicalcpu)
      - name: Run tests
        id: tests
        env:
          QTEST_DISABLE_STACK_DUMP: "1"
        run: |
          ctest --test-dir . --output-on-failure --timeout 120
      - name: Diagnose failed POSIX tests with LLDB
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        timeout-minutes: 6
        run: |
          mkdir -p diagnostics
          python3 - <<'PY'
          import os
          from pathlib import Path
          import signal
          import subprocess

          cases = [
              ("integrated-test", "integrated-test", "judgeAll"),
              ("judging-controller", "judging-controller-tests", "answersOnlyRepeatedBatches"),
          ]
          for directory, executable, function in cases:
              binary = Path("tests", directory, executable).resolve()
              command = [
                  "lldb", "--batch",
                  "-o", "settings set target.env-vars QTEST_DISABLE_STACK_DUMP=1",
                  "-o", "run",
                  "-k", "thread backtrace all",
                  "-k", "register read",
                  "-k", "process kill",
                  "--", str(binary), function, "-nocrashhandler",
              ]
              log = Path("diagnostics", directory + "-lldb.txt")
              with log.open("w") as output:
                  process = subprocess.Popen(
                      command, cwd=binary.parent, stdout=output,
                      stderr=subprocess.STDOUT, start_new_session=True,
                  )
                  try:
                      process.wait(timeout=90)
                  except subprocess.TimeoutExpired:
                      os.killpg(process.pid, signal.SIGKILL)
                      process.wait()
                      output.write("\nLLDB diagnostic exceeded 90 seconds.\n")
                  output.write(f"\nLLDB exit code: {process.returncode}\n")
              print(f"::group::{directory} LLDB diagnostics", flush=True)
              print(log.read_text(), flush=True)
              print("::endgroup::", flush=True)
          PY
      - name: Upload failed test diagnostics
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: posix-tests-macos-${{ matrix.arch }}-${{ matrix.build_type }}
          path: |
            Testing/Temporary/LastTest.log
            diagnostics/*.txt
      # tag 打包
      - name: package
        env:
          Qt6_DIR: ../Qt/${{matrix.qt_ver}}/${{matrix.qt_arch}}
        run: |
          # 拷贝依赖
          #mv ${targetName} ${targetName}.app
          export PATH=$Qt6_DIR/bin:$PATH
          macdeployqt ${targetName}.app -qmldir=. -verbose=1 -dmg
          mv "${targetName}.dmg" "${{ steps.artifact_name.outputs.name }}.dmg"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.artifact_name.outputs.name }}.dmg
          archive: false
          if-no-files-found: error
      - name: uploadRelease
        if: startsWith(github.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.artifact_name.outputs.name }}.dmg
          asset_name: ${{ steps.artifact_name.outputs.name }}.dmg
          tag: ${{ github.ref }}
          overwrite: true
